spring:
  application:
    name: joalheria-api

  datasource:
    url: jdbc:postgresql://localhost:5432/joalheria_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

api:
  security:
    token:
      secret: ${JWT_SECRET:minha-senha-super-secreta-mare-joias-123}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081
  rate-limit:
    requests-per-minute: 100

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://111111111111111:senha-falsa@mare-joias}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-token-de-desenvolvimento}
  back-urls:
    success: https://localhost:3000/checkout/sucesso
    pending: https://localhost:3000/checkout/pendente
    failure: https://localhost:3000/checkout/erro